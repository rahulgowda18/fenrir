apiVersion: apps/v1
kind: Deployment
metadata:
  name: fenrir-backend
spec:
  selector:
    matchLabels:
      app: fenrir-backend
  template:
    metadata:
      labels:
        app: fenrir-backend
    spec:
      containers:
        - name: fenrir-backend
          image: docker.io/rahulgowda526/fenrir-backend
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_HOST
              value: mongo.fenrir.svc.cluster.local
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: fenrir-backend
spec:
  selector:
    app: fenrir-backend 
  ports:
    - port: 80
      targetPort: 8000