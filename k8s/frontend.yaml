apiVersion: apps/v1
kind: Deployment
metadata:
  name: fenrir-frontend
spec:
  selector:
    matchLabels:
      app: fenrir-frontend
  template:
    metadata:
      labels:
        app: fenrir-frontend
    spec:
      containers:
        - name: fenrir-frontend
          image: docker.io/rahulgowda526/fenrir-frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          env:
            - name: BACKEND_URL
              value: http://fenrir-backend.fenrir.svc.cluster.local
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: fenrir-frontend
spec:
  selector:
    app: fenrir-frontend
  ports:
    - port: 80
      targetPort: 9000